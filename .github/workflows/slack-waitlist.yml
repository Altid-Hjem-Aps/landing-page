name: Slack waitlist count

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          curl -sf -X GET https://www.altidhjem.dk/api/cron/slack-waitlist \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
